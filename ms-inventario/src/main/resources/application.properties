spring.application.name=ms-inventario

# Puerto
server.port=8081
servicios.productos.url=http://localhost:8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=linktic
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

sql.update.product=SELECT * FROM linktic.com_empresabrez_updateproductbyid(:productoId, :nuevaCantidad)


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

spring.jpa.properties.hibernate.default_schema=linktic

